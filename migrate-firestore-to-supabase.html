<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura X — Firestore → Supabase Aktarımı</title>
<style>body{font-family:system-ui;background:#0c1120;color:#eef2ff;margin:0;padding:30px}main{max-width:850px;margin:auto;background:#151c2e;border:1px solid #2d3958;border-radius:20px;padding:24px}.muted{color:#aab3ca}button{background:#6d5dfc;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}pre{white-space:pre-wrap;background:#0a0f1b;padding:14px;border-radius:12px;max-height:420px;overflow:auto}</style></head>
<body><main><h1>Aura X veri aktarımı</h1><p class="muted">Bu araç yalnızca bir defalık geçiş içindir. Firebase Firestore kayıtlarını Supabase <code>aurax_documents</code> tablosuna kopyalar. Ana Aura X uygulaması aktarım tamamlandıktan sonra Firebase Firestore okumaz.</p><div class="row"><button onclick="start()">Google ile Yetkili Aktarımı Başlat</button><button onclick="location.reload()" style="background:#283552">Sıfırla</button></div><p id="status" class="muted">Hazır.</p><pre id="log"></pre></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC4thDZHipZQSeZGyKXzeh-m20EC_-rcKg",authDomain:"aura-ultra-x.firebaseapp.com",projectId:"aura-ultra-x",storageBucket:"aura-ultra-x.firebasestorage.app",messagingSenderId:"931526439447",appId:"1:931526439447:web:06aa1a89e0ad98407f6252"};
firebase.initializeApp(firebaseConfig); const fs=firebase.firestore();
const sb=window.supabase.createClient("https://tpfbhikihkkccmzlzgkn.supabase.co","sb_publishable_SmUcZGqg0BimQCo2spXEkw_evh3xlMR");
const COLLECTIONS=["bannedIPs","bannedDevices","users","reports","restrictions","notifications","posts","rooms","statuses","announcements","accountLinks","bannedUsers","votes","bannedEmails"];
const $=id=>document.getElementById(id); const log=t=>{$('log').textContent+=t+"\n";$('log').scrollTop=$('log').scrollHeight};
function toJson(v){if(v&&typeof v.toMillis==='function')return v.toMillis();if(Array.isArray(v))return v.map(toJson);if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v))o[k]=toJson(x);return o}return v}
async function start(){try{$('status').textContent='Google yetkilendirmesi bekleniyor...';const r=await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());log('Google: '+(r.user.email||'hesap'));let total=0;for(const c of COLLECTIONS){$('status').textContent=c+' aktarılıyor...';const snap=await fs.collection(c).get();const rows=snap.docs.map(d=>({collection:c,doc_id:d.id,data:toJson(d.data())}));for(let i=0;i<rows.length;i+=200){const chunk=rows.slice(i,i+200);const {error}=await sb.from('aurax_documents').upsert(chunk,{onConflict:'collection,doc_id'});if(error)throw error;total+=chunk.length;log(c+': '+chunk.length+' kayıt aktarıldı.');}}await firebase.auth().signOut().catch(()=>{});$('status').textContent='Tamamlandı: '+total+' belge Supabase’e aktarıldı.';log('AKTARIM TAMAMLANDI.');}catch(e){console.error(e);$('status').textContent='Hata: '+(e.message||e);log('HATA: '+(e.stack||e.message||e));}}
</script></body></html>
